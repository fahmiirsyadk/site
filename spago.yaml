package:
  name: site
  dependencies:
    - aff
    - argonaut-codecs
    - arrays
    - canvas
    - console
    - datetime
    - effect
    - either
    - foldable-traversable
    - foreign-object
    - integers
    - js-date
    - js-intl
    - luna
    - markdown-it-js
    - maybe
    - node-fs
    - node-path
    - node-process
    - now
    - nullable
    - prelude
    - routing
    - routing-duplex
    - simple-json
    - strings
    - transformation-matrix
    - tuples
    - unsafe-coerce
    - web-dom
    - web-html
    - yaml-next
  # Used by `pnpm bundle` (dev). Production uses purs-backend-es bundle-app + --minify in build.sh.
  bundle:
    platform: browser
    type: app
    module: Main
    outfile: dist/app.js
  run:
    main: PrerenderMain
workspace:
  packageSet:
    registry: 75.7.0
  extraPackages:
    luna:
      git: https://github.com/fahmiirsyadk/luna.git
      ref: a24c61e434ac0f5ce4e5e67412cfc86509b5a985
